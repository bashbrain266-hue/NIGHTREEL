<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Nightreel — movie &amp; series library</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script type="module">
  import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

  // Find these under Supabase Dashboard -> Project settings -> API.
  // The anon/public key is safe to expose in client-side code — it only
  // works within the Row Level Security rules you set on each table.
  const SUPABASE_URL = "https://jhvlyfyhqkmiqlnsdoto.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_WkJZi2alIBlDjAsyMHyzYA_di26WCt4";

  const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  // Expose to the rest of the page (the app's main script is a classic, non-module script)
  window.supabase = supabase;

  // Called by the "Continue with Google" button. Supabase OAuth works by
  // redirecting the whole page to Google and back — not a popup — so this
  // function starts the redirect; it doesn't return a user directly.
  window.supabaseSignInWithGoogle = async function(){
    const { error } = await supabase.auth.signInWithOAuth({
      provider: "google",
      options: { redirectTo: window.location.href }
    });
    if(error) throw error;
  };

  // On load (including right after the Google redirect comes back), check
  // whether there's already an active session and unlock the app if so.
  window.supabaseCheckSession = async function(){
    const { data } = await supabase.auth.getSession();
    return data.session ? data.session.user : null;
  };
</script>
<style>
  :root{
    --bg:#0E0D13; --sidebar:#131019; --surface:#1B1820; --surface2:#221E29; --surface3:#2A2531;
    --text:#F1ECE4; --muted:#9A93A3; --gold:#E8AE49; --gold-dim:rgba(232,174,73,.14);
    --teal:#3F8C8A; --heart:#E2617A; --border:rgba(255,255,255,.09);
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;}
  .mono{font-family:'JetBrains Mono',monospace;}
  .display{font-family:'Fraunces',serif;}
  a{color:inherit;}
  button{font-family:inherit;cursor:pointer;transition:transform .15s ease,background .15s ease,color .15s ease;}
  button:active{transform:scale(.97);}
  input,textarea{font-family:inherit;}
  input:focus,textarea:focus{outline:2px solid var(--gold);outline-offset:1px;}
  ::selection{background:var(--gold);color:#201e26;}
  ::-webkit-scrollbar{height:8px;width:8px;}
  ::-webkit-scrollbar-thumb{background:var(--surface3);border-radius:4px;}

  /* ---------------- Shell layout ---------------- */
  #shell{display:flex;min-height:100vh;}
  #sidebar{width:236px;flex-shrink:0;background:var(--sidebar);border-right:1px solid var(--border);
    display:flex;flex-direction:column;padding:22px 14px;position:sticky;top:0;height:100vh;overflow-y:auto;}
  .sb-brand{display:flex;align-items:center;gap:9px;font-size:19px;font-weight:600;letter-spacing:.4px;color:var(--gold);padding:2px 10px 26px;}
  .sb-nav{display:flex;flex-direction:column;gap:2px;flex:1;}
  .sb-link{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:9px;background:none;border:none;color:var(--muted);font-size:14px;text-align:left;width:100%;}
  .sb-link svg{flex-shrink:0;}
  .sb-link:hover{background:var(--surface);color:var(--text);}
  .sb-link.active{background:var(--gold);color:#201e26;font-weight:600;}
  .sb-link.active svg{stroke:#201e26;}
  .sb-divider{height:1px;background:var(--border);margin:10px 4px;}
  .sb-user{display:flex;align-items:center;gap:10px;padding:12px 10px 4px;border-top:1px solid var(--border);margin-top:8px;}
  .sb-avatar{width:34px;height:34px;border-radius:50%;background:var(--teal);display:flex;align-items:center;justify-content:center;font-weight:600;font-size:13px;flex-shrink:0;}
  .sb-user .name{font-size:13.5px;font-weight:500;line-height:1.3;}
  .sb-user .tag{font-size:10.5px;color:var(--gold);letter-spacing:.3px;}
  .sb-logout{color:#E2617A;margin-top:2px;}
  .sb-logout:hover{background:rgba(226,97,122,.12);color:#E2617A;}

  #mainarea{flex:1;min-width:0;}
  #topbar{position:sticky;top:0;z-index:6;background:rgba(14,13,19,.88);backdrop-filter:blur(8px);border-bottom:1px solid var(--border);
    padding:14px 28px;display:flex;align-items:center;gap:14px;}
  .tb-search{position:relative;flex:1;max-width:420px;}
  .tb-search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted);}
  .tb-search input{width:100%;background:var(--surface);border:1px solid var(--border);border-radius:9px;color:var(--text);padding:9px 12px 9px 34px;font-size:13.5px;}
  .tb-right{display:flex;align-items:center;gap:12px;margin-left:auto;position:relative;}
  .tb-bell{background:var(--surface);border:1px solid var(--border);border-radius:50%;width:38px;height:38px;display:flex;align-items:center;justify-content:center;color:var(--muted);}
  .tb-bell:hover{color:var(--gold);}
  .tb-bell-panel{position:absolute;top:46px;right:52px;background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:12px 14px;font-size:12.5px;color:var(--muted);width:190px;display:none;box-shadow:0 8px 24px rgba(0,0,0,.4);}
  .tb-bell-panel.open{display:block;}
  .tb-profile{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:6px 14px 6px 6px;font-size:13px;}
  .tb-profile.active{background:var(--surface3);}
  .tb-avatar{width:26px;height:26px;border-radius:50%;background:var(--teal);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;}

  .content{padding:26px 28px 60px;max-width:1280px;}

  @media (max-width:880px){
    #shell{flex-direction:column;}
    #sidebar{position:static;width:100%;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center;padding:12px;}
    .sb-brand{padding:4px 8px;}
    .sb-nav{flex-direction:row;flex-wrap:wrap;flex:none;}
    .sb-link{width:auto;padding:8px 10px;}
    .sb-link span.sb-label{display:none;}
    .sb-divider{display:none;}
    .sb-user{border-top:none;margin:0 0 0 auto;padding:4px;}
    .sb-user .name,.sb-user .tag{display:none;}
    .content{padding:20px 16px 50px;}
  }

  /* ---------------- Shared bits ---------------- */
  .sec-head{display:flex;justify-content:space-between;align-items:baseline;margin:30px 0 14px;}
  .sec-head h2{font-size:19px;font-weight:600;margin:0;}
  .sec-head .see-all{color:var(--gold);font-size:12.5px;font-weight:500;background:none;border:none;}
  .empty-note{color:var(--muted);font-size:13.5px;padding:18px 0;line-height:1.6;}

  .filters{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap;}
  .filter-btn{background:var(--surface);color:var(--muted);border:1px solid var(--border);border-radius:20px;padding:7px 16px;font-size:12.5px;letter-spacing:.4px;text-transform:uppercase;font-weight:500;}
  .filter-btn.active{background:var(--gold);color:#201e26;border-color:var(--gold);}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:18px;}
  .card{cursor:pointer;transition:transform .2s ease;position:relative;}
  .card:hover{transform:translateY(-4px);}
  .poster{border-radius:10px 10px 0 0;height:150px;padding:14px;position:relative;overflow:hidden;background-size:cover;background-position:center;display:flex;flex-direction:column;justify-content:space-between;}
  .poster::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(14,13,19,.15) 0%,rgba(14,13,19,.88) 100%);opacity:0;transition:opacity .3s ease;}
  .poster.has-cover::before{opacity:1;}
  .poster-row{position:relative;z-index:1;display:flex;justify-content:space-between;align-items:flex-start;}
  .poster-year{font-size:11px;color:rgba(255,255,255,.85);letter-spacing:.4px;display:flex;align-items:center;gap:5px;background:rgba(14,13,19,.5);padding:3px 8px;border-radius:12px;}
  .match-chip{font-size:10.5px;color:#201e26;background:var(--gold);letter-spacing:.3px;display:flex;align-items:center;gap:4px;padding:3px 8px;border-radius:12px;font-weight:600;}
  .watched-dot{background:var(--teal);border-radius:50%;width:22px;height:22px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .poster-title{position:relative;z-index:1;font-size:19px;font-weight:600;color:var(--text);margin:0;line-height:1.15;}
  .poster-actions{position:absolute;top:10px;right:10px;z-index:2;display:flex;gap:6px;}
  .poster-action-btn{width:26px;height:26px;border-radius:50%;background:rgba(14,13,19,.6);border:1px solid rgba(255,255,255,.15);display:flex;align-items:center;justify-content:center;padding:0;}
  .card-meta{background:var(--surface);border-radius:0 0 10px 10px;padding:11px 14px 14px;border:1px solid var(--border);border-top:none;display:flex;justify-content:space-between;align-items:center;}
  .card-meta .genre{font-size:11.5px;color:var(--muted);}
  .card-meta .rating{font-size:12.5px;color:var(--gold);display:flex;align-items:center;gap:4px;}
  .footnote{color:#4f4c57;font-size:11px;padding:20px 0 20px;}

  /* ---------------- Home ---------------- */
  .home-grid{display:grid;grid-template-columns:1fr 300px;gap:24px;align-items:start;}
  @media (max-width:1000px){ .home-grid{grid-template-columns:1fr;} }

  .hero-wrap{position:relative;}
  .hero-card{border-radius:16px;padding:40px 36px;position:relative;overflow:hidden;min-height:250px;display:flex;flex-direction:column;justify-content:flex-end;background-size:cover;background-position:center;border:1px solid var(--border);}
  .hero-card::before{content:"";position:absolute;inset:0;background:linear-gradient(100deg,rgba(14,13,19,.92) 15%,rgba(14,13,19,.35) 65%,rgba(14,13,19,.15) 100%);opacity:0;transition:opacity .3s ease;}
  .hero-card.has-cover::before{opacity:1;}
  .hero-inner{position:relative;z-index:1;max-width:520px;}
  .hero-eyebrow{color:var(--gold);font-size:11.5px;letter-spacing:2px;text-transform:uppercase;margin:0 0 10px;display:flex;align-items:center;gap:6px;}
  .hero-card h1{font-size:clamp(28px,4vw,42px);font-weight:600;line-height:1.05;margin:0 0 10px;}
  .hero-match{display:flex;align-items:center;gap:6px;color:var(--gold);font-size:13.5px;font-weight:600;margin-bottom:10px;}
  .hero-reason{color:#D9D4CC;font-size:13.5px;margin:0 0 20px;}
  .hero-actions{display:flex;gap:10px;flex-wrap:wrap;}
  .btn-gold{background:var(--gold);color:#201e26;border:none;border-radius:8px;padding:10px 18px;font-size:13.5px;font-weight:600;display:flex;align-items:center;gap:7px;}
  .btn-outline{background:rgba(27,24,32,.7);color:var(--text);border:1px solid rgba(255,255,255,.25);border-radius:8px;padding:10px 18px;font-size:13.5px;font-weight:500;display:flex;align-items:center;gap:7px;}
  .btn-outline.active{background:var(--gold);color:#201e26;border-color:var(--gold);}
  .hero-arrow{position:absolute;top:50%;transform:translateY(-50%);width:34px;height:34px;border-radius:50%;background:rgba(14,13,19,.65);border:1px solid rgba(255,255,255,.2);color:var(--text);display:flex;align-items:center;justify-content:center;z-index:2;}
  .hero-arrow.left{left:-14px;} .hero-arrow.right{right:-14px;}
  .hero-dots{display:flex;gap:6px;justify-content:center;margin-top:12px;}
  .hero-dot{width:6px;height:6px;border-radius:50%;background:var(--border);border:none;padding:0;}
  .hero-dot.active{background:var(--gold);width:16px;border-radius:4px;}

  .cw-row{display:flex;gap:14px;overflow-x:auto;padding-bottom:6px;}
  .cw-card{flex:0 0 190px;cursor:pointer;}
  .cw-thumb{height:100px;border-radius:9px;background-size:cover;background-position:center;position:relative;display:flex;align-items:flex-end;padding:8px;}
  .cw-thumb::before{content:"";position:absolute;inset:0;border-radius:9px;background:linear-gradient(180deg,transparent 40%,rgba(14,13,19,.85) 100%);}
  .cw-check{position:relative;z-index:1;background:var(--teal);border-radius:50%;width:20px;height:20px;display:flex;align-items:center;justify-content:center;}
  .cw-title{font-size:13.5px;font-weight:500;margin:8px 0 2px;}
  .cw-sub{font-size:11px;color:var(--muted);}

  .side-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:20px;}
  .side-card h3{font-size:13px;font-weight:600;margin:0 0 12px;display:flex;justify-content:space-between;align-items:center;}
  .side-card h3 .see-all{color:var(--gold);font-size:11.5px;font-weight:500;background:none;border:none;}
  .side-row{display:flex;align-items:center;gap:10px;margin-bottom:10px;cursor:pointer;}
  .side-row:last-child{margin-bottom:0;}
  .side-thumb{width:44px;height:60px;border-radius:6px;background-size:cover;background-position:center;flex-shrink:0;display:flex;align-items:center;justify-content:center;}
  .side-info p{margin:0;font-size:13px;font-weight:500;line-height:1.3;}
  .side-info .sub{font-size:11px;color:var(--muted);}
  .genre-pills{display:flex;flex-wrap:wrap;gap:8px;}
  .genre-pill{background:var(--surface2);border:1px solid var(--border);color:var(--muted);border-radius:16px;padding:6px 12px;font-size:11.5px;}
  .genre-pill.active{background:var(--gold);color:#201e26;border-color:var(--gold);}

  /* ---------------- Detail ---------------- */
  .wrap-narrow{max-width:760px;margin:0 auto;}
  .back-link{background:none;border:none;color:var(--muted);font-size:13px;display:flex;align-items:center;gap:6px;padding:0;margin-bottom:22px;}
  .hero-banner{border-radius:14px;padding:40px 32px;margin-bottom:22px;position:relative;overflow:hidden;background-size:cover;background-position:center;}
  .hero-banner::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(14,13,19,.35) 0%,rgba(14,13,19,.92) 100%);opacity:0;transition:opacity .3s ease;}
  .hero-banner.has-cover::before{opacity:1;}
  .hero-banner-inner{position:relative;z-index:1;}
  .hero-banner-inner .kind{font-size:12px;color:rgba(255,255,255,.8);letter-spacing:1px;text-transform:uppercase;}
  .hero-banner-inner h1{font-size:clamp(30px,5vw,44px);font-weight:600;color:var(--text);margin:10px 0 16px;}
  .meta-row{display:flex;gap:18px;flex-wrap:wrap;align-items:center;}
  .meta-row span{font-size:13px;color:var(--text);display:flex;align-items:center;gap:5px;}
  .meta-row .rating{color:var(--gold);}
  .blurb{font-size:16px;line-height:1.7;color:#D9D4CC;margin-bottom:22px;}
  .action-row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:36px;}
  .watch-btn{display:flex;align-items:center;gap:8px;background:var(--surface);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:10px 18px;font-size:13.5px;font-weight:500;}
  .watch-btn.watched{background:var(--teal);color:var(--bg);border-color:var(--teal);}
  .watch-btn.on{background:var(--gold);color:#201e26;border-color:var(--gold);}

  .review-heading{font-size:20px;font-weight:600;margin:0 0 18px;display:flex;align-items:center;gap:8px;}
  .review-form{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:18px;margin-bottom:22px;}
  .review-form-row{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:12px;}
  .review-form input[type=text]{flex:1 1 160px;background:var(--surface2);border:1px solid var(--border);border-radius:8px;color:var(--text);padding:9px 12px;font-size:14px;}
  .stars{display:flex;gap:4px;}
  .star-btn{background:none;border:none;padding:2px;}
  .review-form textarea{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:8px;color:var(--text);padding:10px 12px;font-size:14px;resize:vertical;margin-bottom:12px;}
  .post-btn{background:var(--gold);color:#201e26;border:none;border-radius:8px;padding:9px 18px;font-size:13.5px;font-weight:600;}
  .comment{border-left:2px solid var(--gold);padding-left:16px;margin-bottom:14px;}
  .comment-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;flex-wrap:wrap;gap:6px;}
  .comment-head .author{font-weight:500;font-size:14px;}
  .comment-head .date{font-size:11.5px;color:var(--muted);}
  .comment-stars{display:flex;gap:2px;margin-bottom:6px;}
  .comment p{font-size:14.5px;line-height:1.6;color:#D9D4CC;margin:0;}

  /* ---------------- Collection ---------------- */
  .tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin-bottom:22px;overflow-x:auto;}
  .tab-btn{padding:10px 16px;background:none;border:none;color:var(--muted);font-size:13.5px;border-bottom:2px solid transparent;white-space:nowrap;}
  .tab-btn.active{color:var(--gold);border-color:var(--gold);font-weight:600;}
  .stats-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin-top:8px;}
  .stat-box{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:16px;text-align:center;}
  .stat-box .num{font-size:26px;font-weight:600;margin:0;}
  .stat-box .lbl{font-size:11px;color:var(--muted);margin:4px 0 0;text-transform:uppercase;letter-spacing:.4px;}
  .log-row{display:flex;align-items:center;gap:14px;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:10px 16px;margin-bottom:10px;cursor:pointer;}
  .log-thumb{width:42px;height:42px;border-radius:8px;background-size:cover;background-position:center;flex-shrink:0;display:flex;align-items:center;justify-content:center;}
  .log-info{flex:1;min-width:0;}
  .log-info p{margin:0;font-weight:500;font-size:14.5px;}
  .log-info .sub{margin:2px 0 0;font-size:11.5px;color:var(--muted);}
  .log-date{font-size:11.5px;color:var(--muted);flex-shrink:0;display:flex;align-items:center;gap:6px;}

  /* ---------------- Profile ---------------- */
  .member-card{background:linear-gradient(135deg,var(--surface2) 0%,var(--surface) 100%);border:1px solid var(--border);border-radius:14px;padding:26px 28px;margin-bottom:24px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:16px;}
  .member-card .tag{font-size:11px;color:var(--gold);letter-spacing:1.5px;text-transform:uppercase;margin:0 0 6px;}
  .member-card h1{font-size:26px;font-weight:600;margin:0 0 4px;}
  .member-card .sub{font-size:12.5px;color:var(--muted);}
  .member-left{display:flex;gap:16px;align-items:center;}
  .member-avatar{width:64px;height:64px;border-radius:50%;background:var(--teal);display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:600;flex-shrink:0;}
  .edit-btn{background:var(--surface3);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:8px 14px;font-size:12.5px;}
  .profile-grid{display:grid;grid-template-columns:1.2fr 1fr;gap:20px;align-items:start;}
  @media (max-width:820px){ .profile-grid{grid-template-columns:1fr;} }
  .panel{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:20px;margin-bottom:20px;}
  .panel h3{font-size:14px;font-weight:600;margin:0 0 14px;}
  .achv-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(85px,1fr));gap:14px;}
  .achv{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;opacity:.32;}
  .achv.earned{opacity:1;}
  .achv-circle{width:46px;height:46px;border-radius:50%;border:1px solid var(--gold);background:var(--gold-dim);display:flex;align-items:center;justify-content:center;color:var(--gold);}
  .achv span{font-size:10.5px;color:var(--muted);line-height:1.3;}
  .donut-wrap{display:flex;align-items:center;gap:18px;}
  .donut{width:110px;height:110px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;position:relative;}
  .donut-hole{width:70px;height:70px;border-radius:50%;background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;}
  .donut-hole .n{font-size:18px;font-weight:600;}
  .donut-hole .l{font-size:9px;color:var(--muted);}
  .donut-legend{display:flex;flex-direction:column;gap:8px;font-size:12.5px;}
  .legend-dot{width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:7px;}
  .activity-row{display:flex;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid var(--border);}
  .activity-row:last-child{border-bottom:none;}
  .activity-thumb{width:36px;height:36px;border-radius:7px;background-size:cover;background-position:center;flex-shrink:0;}
  .activity-info{flex:1;min-width:0;}
  .activity-info p{margin:0;font-size:13px;font-weight:500;}
  .activity-info .sub{font-size:11px;color:var(--muted);}
  .activity-date{font-size:11px;color:var(--muted);flex-shrink:0;}

  /* ---------------- Settings ---------------- */
  .settings-form{display:flex;flex-direction:column;gap:14px;max-width:420px;}
  .settings-form label{font-size:12.5px;color:var(--muted);display:block;margin-bottom:6px;}

const state = {
  view:"home", selectedId:null, query:"", filter:"all",
  username:null, watched:{}, comments:{}, covers:{}, watchlist:{}, favorites:{},
  gateStage:"checking", gateError:"", gateBusy:false, gateMode:"login",
  homeGenre:null, heroIndex:0, collectionTab:"overview", bellOpen:false,
};

function loadLocal(){
  try{
    const a = JSON.parse(localStorage.getItem("nightreel_auth")||"null");
    if(a) state.username = a.name;
    state.gateStage = a ? (a.google ? "unlocked" : "login") : "signup";
  }catch(e){ state.gateStage = "signup"; }
  try{ state.watched = JSON.parse(localStorage.getItem("nightreel_watched")||"{}"); }catch(e){}
  try{ state.comments = JSON.parse(localStorage.getItem("nightreel_comments")||"{}"); }catch(e){}
  try{ state.watchlist = JSON.parse(localStorage.getItem("nightreel_watchlist")||"{}"); }catch(e){}
  try{ state.favorites = JSON.parse(localStorage.getItem("nightreel_favorites")||"{}"); }catch(e){}
}
function saveWatched(){ localStorage.setItem("nightreel_watched", JSON.stringify(state.watched)); }
function saveComments(){ localStorage.setItem("nightreel_comments", JSON.stringify(state.comments)); }
function saveWatchlist(){ localStorage.setItem("nightreel_watchlist", JSON.stringify(state.watchlist)); }
function saveFavorites(){ localStorage.setItem("nightreel_favorites", JSON.stringify(state.favorites)); }

function communityRating(item){
  const list = state.comments[item.id]||[];
  if(!list.length) return item.base.toFixed(1);
  const sum = list.reduce((a,c)=>a+c.rating,0);
  return (((sum/list.length)*2 + item.base)/3).toFixed(1);
}
function matchPct(item){ return Math.min(99, Math.round(item.base*10)); }
function fmtDate(iso){
  try{ return new Date(iso).toLocaleDateString(undefined,{month:"short",day:"numeric",year:"numeric"}); }catch(e){ return iso; }
}
function initials(name){
  if(!name) return "?";
  return name.trim().split(/\s+/).slice(0,2).map(s=>s[0].toUpperCase()).join("");
}

/* ------------------------------------------------------------------ */
/* Covers — fetched live from Wikipedia's public, CORS-open API        */
/* ------------------------------------------------------------------ */
async function fetchCoverUrl(item){
  // Primary: Wikipedia's REST summary endpoint (usually the infobox / poster image).
  try{
    const res = await fetch("https://en.wikipedia.org/api/rest_v1/page/summary/"+encodeURIComponent(item.wiki));
    if(res.ok){
      const data = await res.json();
      const src = (data.thumbnail && data.thumbnail.source) || (data.originalimage && data.originalimage.source);
      if(src) return src;
    }
  }catch(e){ /* fall through to the backup endpoint */ }

  // Fallback: the classic pageimages action API, which resolves redirects too.
  try{
    const url = "https://en.wikipedia.org/w/api.php?action=query&redirects=1&titles="+encodeURIComponent(item.wiki)+"&prop=pageimages&format=json&pithumbsize=600&origin=*";
    const res = await fetch(url);
    if(res.ok){
      const data = await res.json();
      const pages = data && data.query && data.query.pages;
      const page = pages ? Object.values(pages)[0] : null;
      const src = page && page.thumbnail && page.thumbnail.source;
      if(src) return src;
    }
  }catch(e){ /* keep the gradient fallback */ }

  return null;
}

async function loadCovers(){
  TITLES.forEach(async (item)=>{
    const src = await fetchCoverUrl(item);
    if(!src) return;
    state.covers[item.id] = src;
    document.querySelectorAll('[data-poster="'+item.id+'"]').forEach(el=>{
      el.style.backgroundImage = "url('"+src+"')";
      el.classList.add("has-cover");
    });
    document.querySelectorAll('[data-thumb="'+item.id+'"]').forEach(el=>{
      el.style.backgroundImage = "url('"+src+"')";
    });
  });
}

/* ------------------------------------------------------------------ */
/* Derived lists                                                        */
/* ------------------------------------------------------------------ */
function heroList(){ return TITLES.slice().sort((a,b)=>b.base-a.base).slice(0,5); }
function trendingList(){ return TITLES.filter(t=>t.type==="movie").sort((a,b)=>b.base-a.base).slice(0,3); }
function popularSeriesList(){ return TITLES.filter(t=>t.type==="series").sort((a,b)=>b.base-a.base).slice(0,3); }
function genreList(){ return [...new Set(TITLES.map(t=>t.genre))]; }
function recommendedList(){
  return TITLES.filter(t=>!state.watched[t.id])
    .filter(t=> !state.homeGenre || t.genre===state.homeGenre)
    .sort((a,b)=>matchPct(b)-matchPct(a));
}
function continueWatchingList(){
  return Object.keys(state.watched)
    .map(id=>TITLES.find(t=>t.id===id)).filter(Boolean)
    .sort((a,b)=> state.watched[b.id] > state.watched[a.id] ? 1 : -1)
    .slice(0,4);
}
function recentActivity(){
  const events = [];
  Object.keys(state.watched).forEach(id=>{
    const item = TITLES.find(t=>t.id===id); if(!item) return;
    events.push({ type:"watched", item, date: state.watched[id] });
  });
  Object.keys(state.comments).forEach(id=>{
    const item = TITLES.find(t=>t.id===id); if(!item) return;
    (state.comments[id]||[]).forEach(c=>{
      events.push({ type:"review", item, date:c.date, rating:c.rating });
    });
  });
  return events.sort((a,b)=> b.date > a.date ? 1 : -1).slice(0,6);
}
function computeStats(){
  const watchedItems = Object.keys(state.watched).map(id=>TITLES.find(t=>t.id===id)).filter(Boolean);
  const movies = watchedItems.filter(t=>t.type==="movie").length;
  const series = watchedItems.filter(t=>t.type==="series").length;
  let reviews = 0; Object.values(state.comments).forEach(list=>reviews+=list.length);
  return { total:watchedItems.length, movies, series, reviews, watchlist:Object.keys(state.watchlist).length, favorites:Object.keys(state.favorites).length };
}
function favoriteGenres(){
  const watchedItems = Object.keys(state.watched).map(id=>TITLES.find(t=>t.id===id)).filter(Boolean);
  const tally = {};
  watchedItems.forEach(t=>{ tally[t.genre] = (tally[t.genre]||0)+1; });
  return Object.keys(tally).sort((a,b)=>tally[b]-tally[a]).slice(0,4);
}

function renderShell(){
  const sidebar = document.getElementById("sidebar");
  const topbar = document.getElementById("topbar");
  if(state.gateStage !== "unlocked"){ sidebar.innerHTML=""; topbar.innerHTML=""; return; }

  sidebar.innerHTML =
    '<div class="sb-brand">'+ICONS.film(20)+' NIGHTREEL</div>'+
    '<nav class="sb-nav">'+
      NAV_ITEMS.map(n=>'<button class="sb-link'+(state.view===n.id?" active":"")+'" data-nav="'+n.id+'">'+n.icon+'<span class="sb-label">'+n.label+'</span></button>').join("")+
    '</nav>'+
    '<div class="sb-divider"></div>'+
    '<div class="sb-user"><div class="sb-avatar">'+initials(state.username)+'</div><div><p class="name">'+escapeHtml(state.username||"")+'</p><p class="tag">Nightreel member</p></div></div>'+
    '<button class="sb-link sb-logout" id="sidebar-logout">'+ICONS.logout+'<span class="sb-label">Disconnect</span></button>';

  const bellPanel = '<div class="tb-bell-panel'+(state.bellOpen?" open":"")+'" id="bell-panel">You\u2019re all caught up \u2014 no new notifications.</div>';
  topbar.innerHTML =
    (["profile","settings","collection"].includes(state.view) ? '<div style="flex:1;"></div>' :
      '<div class="tb-search">'+ICONS.search+'<input id="search-input" placeholder="Search movies, series, people…" value="'+escapeHtml(state.query)+'"/></div>')+
    '<div class="tb-right">'+
      '<button class="tb-bell" id="bell-btn">'+ICONS.bell+'</button>'+bellPanel+
      '<button class="tb-profile'+(state.view==="profile"?" active":"")+'" data-nav="profile"><span class="tb-avatar">'+initials(state.username)+'</span>'+escapeHtml(state.username||"Your profile")+'</button>'+
    '</div>';

  const input = document.getElementById("search-input");
  if(input) input.addEventListener("input", (e)=>{ state.query = e.target.value; renderScreen(); });

  sidebar.querySelectorAll("[data-nav]").forEach(btn=>{
    btn.addEventListener("click", ()=>{ state.view = btn.dataset.nav; state.homeGenre=null; renderAll(); window.scrollTo(0,0); });
  });
  topbar.querySelectorAll("[data-nav]").forEach(btn=>{
    btn.addEventListener("click", ()=>{ state.view = btn.dataset.nav; renderAll(); window.scrollTo(0,0); });
  });
  const bellBtn = document.getElementById("bell-btn");
  if(bellBtn) bellBtn.addEventListener("click", (e)=>{ e.stopPropagation(); state.bellOpen = !state.bellOpen; renderShell(); });
  const logoutBtn = document.getElementById("sidebar-logout");
  if(logoutBtn) logoutBtn.addEventListener("click", handleDisconnect);
}

function handleDisconnect(){
  state.gateStage = "login";
  state.gateError = "";
  state.bellOpen = false;
  renderGate();
  renderShell();
}

function posterHTML(item, innerHTML, extraClass){
  const cover = state.covers[item.id];
  let style = 'background:'+item.tone+';background-size:cover;background-position:center;';
  if(cover) style += 'background-image:url(\''+cover+'\');';
  return '<div class="'+(extraClass||"poster")+(cover?' has-cover':'')+'" data-poster="'+item.id+'" style="'+style+'">'+innerHTML+'</div>';
}

function cardActionsHTML(item){
  const inWatchlist = !!state.watchlist[item.id];
  const isFav = !!state.favorites[item.id];
  return '<div class="poster-actions">'+
    '<button class="poster-action-btn" data-toggle-watchlist="'+item.id+'" title="Watchlist">'+ICONS.bookmark(inWatchlist)+'</button>'+
    '<button class="poster-action-btn" data-toggle-favorite="'+item.id+'" title="Favorite">'+ICONS.heart(isFav)+'</button>'+
  '</div>';
}

function cardHTML(item, opts){
  opts = opts || {};
  const watched = !!state.watched[item.id];
  const inner =
    cardActionsHTML(item)+
    '<div class="poster-row">'+
      '<span class="'+(opts.showMatch?'match-chip':'poster-year')+'">'+
        (opts.showMatch ? ICONS.star(true)+matchPct(item)+'% Match' : (item.type==="movie"?ICONS.film(13):ICONS.tv(13))+item.year)+
      '</span>'+
      (watched && !opts.showMatch ? '<span class="watched-dot">'+ICONS.check+'</span>' : '')+
    '</div>'+
    '<h3 class="poster-title">'+escapeHtml(item.title)+'</h3>';
  return (
    '<div class="card" data-open="'+item.id+'">'+
      posterHTML(item, inner)+
      '<div class="card-meta"><span class="genre mono">'+item.genre+' · '+item.runtime+'</span><span class="rating mono">'+ICONS.star(true)+communityRating(item)+'</span></div>'+
    '</div>'
  );
}

function sideRowHTML(item){
  const cover = state.covers[item.id];
  const style = 'background:'+item.tone+';background-size:cover;background-position:center;'+(cover?"background-image:url('"+cover+"');":'');
  return '<div class="side-row" data-open="'+item.id+'"><div class="side-thumb" data-thumb="'+item.id+'" style="'+style+'"></div>'+
    '<div class="side-info"><p>'+escapeHtml(item.title)+'</p><p class="sub mono">'+item.year+'</p></div></div>';
}

/* ------------------------------------------------------------------ */
/* Browse pages: Movies / Series / Watchlist / Favorites / Recs        */
/* ------------------------------------------------------------------ */
function browseHTML(config){
  let list = TITLES.slice();
  if(config.type) list = list.filter(t=>t.type===config.type);
  if(config.onlyIds) list = list.filter(t=>config.onlyIds[t.id]);
  if(config.sortByMatch) list = list.sort((a,b)=>matchPct(b)-matchPct(a));
  if(state.query) list = list.filter(t=>t.title.toLowerCase().includes(state.query.toLowerCase()));
  if(state.filter!=="all") list = list.filter(t=>t.type===state.filter);

  const filters = config.showTypeFilter
    ? '<div class="filters">'+["all","movie","series"].map(f=>'<button class="filter-btn mono'+(state.filter===f?" active":"")+'" data-filter="'+f+'">'+(f==="all"?"All":f==="movie"?"Movies":"Series")+'</button>').join("")+'</div>'
    : '';

  const grid = list.length===0
    ? '<p class="empty-note">'+config.emptyText+'</p>'
    : '<div class="grid">'+list.map(item=>cardHTML(item,{showMatch:!!config.sortByMatch})).join("")+'</div>';

  return '<h1 class="display" style="font-size:26px;margin:0 0 18px;">'+config.title+'</h1>'+filters+grid;
}

/* ------------------------------------------------------------------ */
/* Render + wire                                                        */
/* ------------------------------------------------------------------ */
function renderScreen(){
  const el = document.getElementById("screen");
  if(state.gateStage !== "unlocked"){ el.innerHTML=""; return; }
  if(state.view==="home") el.innerHTML = homeHTML();
  else if(state.view==="detail") el.innerHTML = detailHTML(TITLES.find(t=>t.id===state.selectedId));
  else if(state.view==="movies") el.innerHTML = browseHTML({type:"movie", title:"Movies", emptyText:'No movies match "'+escapeHtml(state.query)+'".', showTypeFilter:false});
  else if(state.view==="series") el.innerHTML = browseHTML({type:"series", title:"TV Series", emptyText:'No series match "'+escapeHtml(state.query)+'".', showTypeFilter:false});
  else if(state.view==="recommendations") el.innerHTML = browseHTML({sortByMatch:true, title:"AI Recommendations", emptyText:"You've watched everything in the library — nice work.", showTypeFilter:true});
  else if(state.view==="watchlist") el.innerHTML = browseHTML({onlyIds:state.watchlist, title:"Watchlist", emptyText:"Your watchlist is empty — bookmark a title to save it here.", showTypeFilter:true});
  else if(state.view==="favorites") el.innerHTML = browseHTML({onlyIds:state.favorites, title:"Favorites", emptyText:"No favorites yet — heart a title to add it here.", showTypeFilter:true});
  else if(state.view==="collection") el.innerHTML = collectionHTML();
  else if(state.view==="settings") el.innerHTML = settingsHTML();
  else el.innerHTML = profileHTML();
  wireScreen();
}
function renderAll(){ renderShell(); renderScreen(); }

function toggleWatchlist(id){
  if(state.watchlist[id]) delete state.watchlist[id]; else state.watchlist[id] = new Date().toISOString();
  saveWatchlist();
}
function toggleFavorite(id){
  if(state.favorites[id]) delete state.favorites[id]; else state.favorites[id] = new Date().toISOString();
  saveFavorites();
}

function wireScreen(){
  document.querySelectorAll("[data-open]").forEach(el=>{
    el.addEventListener("click", (e)=>{
      if(e.target.closest("[data-toggle-watchlist],[data-toggle-favorite],[data-hero-prev],[data-hero-next],[data-hero-dot]")) return;
      state.selectedId = el.dataset.open; state.view="detail"; renderAll(); window.scrollTo(0,0);
    });
  });
  document.querySelectorAll("[data-toggle-watchlist]").forEach(el=>{
    el.addEventListener("click", (e)=>{ e.stopPropagation(); toggleWatchlist(el.dataset.toggleWatchlist); renderScreen(); });
  });
  document.querySelectorAll("[data-toggle-favorite]").forEach(el=>{
    el.addEventListener("click", (e)=>{ e.stopPropagation(); toggleFavorite(el.dataset.toggleFavorite); renderScreen(); });
  });
  document.querySelectorAll("[data-filter]").forEach(el=>{
    el.addEventListener("click", ()=>{ state.filter = el.dataset.filter; renderScreen(); });
  });
  document.querySelectorAll("[data-genre]").forEach(el=>{
    el.addEventListener("click", ()=>{ state.homeGenre = (state.homeGenre===el.dataset.genre) ? null : el.dataset.genre; renderScreen(); });
  });
  document.querySelectorAll("[data-tab]").forEach(el=>{
    el.addEventListener("click", ()=>{ state.collectionTab = el.dataset.tab; renderScreen(); });
  });
  document.querySelectorAll("[data-tab-nav]").forEach(el=>{
    el.addEventListener("click", ()=>{ state.collectionTab = el.dataset.tabNav; renderScreen(); });
  });
  const heroPrev = document.querySelector("[data-hero-prev]");
  const heroNext = document.querySelector("[data-hero-next]");
  if(heroPrev) heroPrev.addEventListener("click", (e)=>{ e.stopPropagation(); state.heroIndex = (state.heroIndex - 1 + heroList().length) % heroList().length; renderScreen(); });
  if(heroNext) heroNext.addEventListener("click", (e)=>{ e.stopPropagation(); state.heroIndex = (state.heroIndex + 1) % heroList().length; renderScreen(); });
  document.querySelectorAll("[data-hero-dot]").forEach(el=>{
    el.addEventListener("click", (e)=>{ e.stopPropagation(); state.heroIndex = parseInt(el.dataset.heroDot,10); renderScreen(); });
  });

  const back = document.querySelector("[data-back]");
  if(back) back.addEventListener("click", ()=>{ state.view="home"; renderAll(); });

  const watchBtn = document.querySelector("[data-watch]");
  if(watchBtn) watchBtn.addEventListener("click", ()=>{
    const id = watchBtn.dataset.watch;
    if(state.watched[id]) delete state.watched[id]; else state.watched[id] = new Date().toISOString();
    saveWatched();
    renderScreen();
  });

  const starPicker = document.getElementById("star-picker");
  if(starPicker){
    let rating = 4;
    starPicker.querySelectorAll("[data-star]").forEach(btn=>{
      btn.addEventListener("click", ()=>{
        rating = parseInt(btn.dataset.star,10);
        starPicker.querySelectorAll("[data-star]").forEach(b=>{
          b.innerHTML = ICONS.star(parseInt(b.dataset.star,10) <= rating);
        });
      });
    });
    const form = document.getElementById("review-form");
    form.addEventListener("submit",(e)=>{
      e.preventDefault();
      const name = document.getElementById("review-name").value.trim();
      const text = document.getElementById("review-text").value.trim();
      if(!name || !text) return;
      const id = state.selectedId;
      if(!state.comments[id]) state.comments[id] = [];
      state.comments[id].unshift({author:name, rating:rating, text:text, date:new Date().toISOString()});
      saveComments();
      renderScreen();
    });
  }

  const editNameBtn = document.getElementById("edit-name-btn");
  if(editNameBtn) editNameBtn.addEventListener("click", ()=>{
    const next = prompt("Update your display name", state.username||"");
    if(next && next.trim()){
      state.username = next.trim();
      try{
        const a = JSON.parse(localStorage.getItem("nightreel_auth")||"null");
        if(a){ a.name = state.username; localStorage.setItem("nightreel_auth", JSON.stringify(a)); }
      }catch(e){}
      renderAll();
    }
  });

  const settingsSave = document.getElementById("settings-save");
  if(settingsSave) settingsSave.addEventListener("click", ()=>{
    const val = document.getElementById("settings-name").value.trim();
    if(!val) return;
    state.username = val;
    try{
      const a = JSON.parse(localStorage.getItem("nightreel_auth")||"null");
      if(a){ a.name = state.username; localStorage.setItem("nightreel_auth", JSON.stringify(a)); }
    }catch(e){}
    renderAll();
  });
  const settingsDisconnect = document.getElementById("settings-disconnect");
  if(settingsDisconnect) settingsDisconnect.addEventListener("click", handleDisconnect);
  const settingsReset = document.getElementById("settings-reset");
  if(settingsReset) settingsReset.addEventListener("click", ()=>{
    localStorage.removeItem("nightreel_auth");
    state.gateStage="signup"; state.gateError=""; state.view="home";
    renderGate(); renderAll();
  });
}

function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, s=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[s]));
}

document.addEventListener("click", (e)=>{
  if(state.bellOpen && !e.target.closest(".tb-bell") && !e.target.closest(".tb-bell-panel")){
    state.bellOpen = false; renderShell();
  }
});

  return '<div class="gate-collage">'+tiles.map(t=>{
    const cover = state.covers[t.id];
    const style = 'background:'+t.tone+';'+(cover?"background-image:url('"+cover+"');background-size:cover;background-position:center;":'');
    return '<div class="gate-collage-tile" data-poster="'+t.id+'" style="'+style+'"></div>';
  }).join("")+'</div>';
}

function renderGate(){
  const gate = document.getElementById("gate");
  if(state.gateStage==="unlocked"){ gate.classList.add("hidden"); return; }
  gate.classList.remove("hidden","leaving");

  if(state.gateStage==="checking"){
    gate.innerHTML = '<div style="width:100%;display:flex;align-items:center;justify-content:center;"><p class="mono" style="color:var(--muted);font-size:13px;">opening the box office…</p></div>';
    return;
  }

  const isLogin = state.gateStage==="login";
  let savedName = "", hasAuth = false;
  try{ const a = JSON.parse(localStorage.getItem("nightreel_auth")||"null"); if(a){ savedName = a.name; hasAuth = true; } }catch(e){}

  gate.innerHTML =
    '<div class="gate-shell">'+
      '<div class="gate-left">'+
        collageHTML()+
        '<div class="gate-left-inner">'+
          '<div class="gate-brand">'+ICONS.film(24)+' NIGHTREEL</div>'+
          '<div class="gate-headline">'+
            '<span class="line">DISCOVER.</span>'+
            '<span class="line">MATCH.</span>'+
            '<span class="line accent">WATCH.</span>'+
          '</div>'+
          '<p class="gate-sub">Personalized movie and series recommendations, a running log of what you\'ve watched, and reviews from people who\'ve seen it too.</p>'+
          '<div class="gate-features">'+
            '<div class="gate-feature"><span class="ic">'+ICONS.spark+'</span>Smart recommendations matched to what you\'ve watched</div>'+
            '<div class="gate-feature"><span class="ic">'+ICONS.star(true)+'</span>Community ratings from real reviews</div>'+
            '<div class="gate-feature"><span class="ic">'+ICONS.bookmark(true)+'</span>Your watchlist, saved and synced on this device</div>'+
          '</div>'+
        '</div>'+
      '</div>'+
      '<div class="gate-right">'+
        '<button class="gate-help" id="gate-help">Need help?</button>'+
        '<div class="gate-card" id="gate-card">'+
          '<p class="gate-tag mono">'+(isLogin?"Welcome back":"Join Nightreel")+'</p>'+
          '<h1 class="display">'+(isLogin ? "Sign in to your account" : "Create your account") +'</h1>'+
          '<p class="sub">'+(isLogin ? "Continue your journey and find your next favorite watch." : "Set a name and password to start your viewing log.")+'</p>'+
          '<form id="gate-form">'+
            (isLogin ? '' :
              '<label class="gate-label">Your name</label>'+
              '<div class="gate-input-wrap">'+ICONS.user(15)+'<input class="gate-input" id="gate-name" placeholder="Enter your name" required autofocus/></div>')+
            '<label class="gate-label">Password</label>'+
            '<div class="gate-input-wrap">'+ICONS.lock+'<input class="gate-input" id="gate-password" type="password" placeholder="'+(isLogin?"Enter your password":"Create a password")+'" required '+(isLogin?"autofocus":"")+' style="padding-right:40px;"/>'+
              '<button type="button" class="gate-eye" id="gate-eye">'+ICONS.eye(false)+'</button>'+
            '</div>'+
            (isLogin ? '<div class="gate-row-between"><label class="gate-remember"><input type="checkbox" checked/> Remember me</label><button type="button" class="gate-reset mono" id="gate-reset-inline" style="background:none;border:none;color:var(--gold);">Forgot password?</button></div>' : '')+
            (state.gateError ? '<p class="gate-error">'+escapeHtml(state.gateError)+'</p>' : '')+
            '<button type="submit" class="gate-submit">'+(state.gateBusy ? "Please wait…" : (isLogin?"Sign In "+ICONS.chevRight:"Create Account "+ICONS.chevRight))+'</button>'+
          '</form>'+
          '<div class="gate-divider">or continue with</div>'+
          '<button class="gate-social" id="gate-google"><svg width="16" height="16" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.1c-.22-.66-.35-1.36-.35-2.1s.13-1.44.35-2.1V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l3.66-2.84z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/></svg>Continue with Google</button>'+
          '<button class="gate-social" id="gate-apple"><svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><path d="M16.365 1.43c0 1.14-.415 2.02-1.244 2.86-.83.845-1.83 1.34-2.99 1.25-.145-1.11.41-2.06 1.24-2.87.83-.84 1.9-1.36 3-1.24zm3.61 15.55c-.55 1.27-.81 1.83-1.52 2.94-.99 1.55-2.39 3.48-4.12 3.5-1.54.02-1.94-.99-4.03-.98-2.1.01-2.54.99-4.08.97-1.73-.02-3.06-1.76-4.05-3.31C-.32 16.71-.7 11.35 1.09 8.34c1.27-2.13 3.24-3.37 5.06-3.37 1.84 0 3.01 1.04 4.53 1.04 1.48 0 2.4-1.04 4.53-1.04 1.63 0 3.36.9 4.6 2.45-4.05 2.21-3.39 8.02.19 9.53z"/></svg>Continue with Apple</button>'+
          '<p class="gate-switch">'+(isLogin
            ? '<span>Don\u2019t have an account? </span><button id="gate-to-signup">Create one '+ICONS.chevRight+'</button>'
            : (hasAuth ? '<span>Already have an account? </span><button id="gate-to-login">Sign in</button>' : '<span class="gate-note" style="margin:0;">Stored on this device only — a demo lock, not bank-grade security.</span>'))+
          '</p>'+
        '</div>'+
      '</div>'+
    '</div>';

  document.getElementById("gate-form").addEventListener("submit", isLogin ? handleLogin : handleSignup);
  const eyeBtn = document.getElementById("gate-eye");
  if(eyeBtn) eyeBtn.addEventListener("click", ()=>{
    const inp = document.getElementById("gate-password");
    const showing = inp.type === "text";
    inp.type = showing ? "password" : "text";
    eyeBtn.innerHTML = ICONS.eye(!showing);
  });
  const toSignup = document.getElementById("gate-to-signup");
  if(toSignup) toSignup.addEventListener("click", ()=>{ state.gateStage="signup"; state.gateError=""; renderGate(); });
  const toLogin = document.getElementById("gate-to-login");
  if(toLogin) toLogin.addEventListener("click", ()=>{ state.gateStage="login"; state.gateError=""; renderGate(); });
  const resetInline = document.getElementById("gate-reset-inline");
  if(resetInline) resetInline.addEventListener("click", ()=>{
    localStorage.removeItem("nightreel_auth");
    state.gateStage = "signup"; state.gateError=""; renderGate();
  });
  const helpBtn = document.getElementById("gate-help");
  if(helpBtn) helpBtn.addEventListener("click", ()=>{
    alert("This is a demo app. Your account, reviews, watchlist and favorites are stored only in this browser — there's no real server behind it.");
  });
  const googleBtn = document.getElementById("gate-google");
  if(googleBtn) googleBtn.addEventListener("click", async ()=>{
    if(!window.supabaseSignInWithGoogle){
      state.gateError = "Google sign-in isn't ready yet — try again in a moment.";
      renderGate();
      return;
    }
    googleBtn.disabled = true;
    try{
      // This redirects the whole page to Google and back — it does not
      // return here. The signed-in user is picked up on the next load by
      // checkSupabaseSession() near the bottom of this script.
      await window.supabaseSignInWithGoogle();
    }catch(err){
      googleBtn.disabled = false;
      state.gateError = "Google sign-in failed: " + (err && err.message ? err.message : "unknown error");
      renderGate();
    }
  });
  const appleBtn = document.getElementById("gate-apple");
  if(appleBtn) appleBtn.addEventListener("click", ()=>{
    state.gateError = "Apple sign-in isn't wired up in this demo — use the form above.";
    renderGate();
  });
}

function handleSignup(e){
  e.preventDefault();
  const name = document.getElementById("gate-name").value.trim();
  const password = document.getElementById("gate-password").value;
  if(!name){ state.gateError="Enter a name."; renderGate(); return; }
  if(password.length<4){ state.gateError="Password needs at least 4 characters."; renderGate(); return; }
  localStorage.setItem("nightreel_auth", JSON.stringify({name, password}));
  state.username = name;
  unlockGate();
}

function handleLogin(e){
  e.preventDefault();
  const password = document.getElementById("gate-password").value;
  let auth = null;
  try{ auth = JSON.parse(localStorage.getItem("nightreel_auth")||"null"); }catch(err){}
  if(auth && auth.password===password){
    state.username = auth.name;
    unlockGate();
  } else {
    state.gateError = "That password doesn't match.";
    renderGate();
    const card = document.getElementById("gate-card");
    card.classList.add("shake");
    setTimeout(()=>card.classList.remove("shake"),400);
  }
}

function unlockGate(){
  const gate = document.getElementById("gate");
  gate.classList.add("leaving");
  setTimeout(()=>{
    state.gateStage = "unlocked";
    renderAll();
  }, 650);
}

/* ------------------------------------------------------------------ */
/* Boot                                                                 */
/* ------------------------------------------------------------------ */
loadLocal();
renderGate();
renderAll();
loadCovers();

// Pick up a Google sign-in after the redirect back from Supabase/Google,
// or a still-active session on a fresh page load.
(async function checkSupabaseSession(){
  if(!window.supabaseCheckSession) return;
  try{
    const user = await window.supabaseCheckSession();
    if(user){
      const name = (user.user_metadata && (user.user_metadata.full_name || user.user_metadata.name)) || user.email || "Nightreel member";
      state.username = name;
      localStorage.setItem("nightreel_auth", JSON.stringify({name, google:true}));
      if(state.gateStage !== "unlocked"){ unlockGate(); }
    }
  }catch(e){ /* no active session — leave the gate as-is */ }
})();

</script>
</body>
</html>
